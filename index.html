<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fix My Work</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f7fb;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  color: #202124;
}

.card {
  width: 100%;
  max-width: 620px;
  background: white;
  border-radius: 30px;
  padding: 48px 44px;
  box-shadow: 0 15px 45px rgba(0,0,0,0.10);
}

.logo {
  text-align: center;
  font-size: 70px;
  margin-bottom: 18px;
}

h1 {
  text-align: center;
  margin: 0;
  font-size: 42px;
  font-weight: 800;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  font-size: 20px;
  margin: 12px 0 42px;
}

label {
  display: block;
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 10px;
}

input {
  width: 100%;
  height: 64px;
  border: 1px solid #d6dbe3;
  border-radius: 16px;
  padding: 0 18px;
  font-size: 20px;
  outline: none;
  margin-bottom: 18px;
}

input:focus {
  border-color: #4285f4;
  box-shadow: 0 0 0 3px rgba(66,133,244,0.12);
}

button {
  width: 100%;
  height: 64px;
  border: 0;
  border-radius: 16px;
  background: #4285f4;
  color: white;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}

.secondary {
  background: #eef3fb;
  color: #2459a6;
  margin-top: 12px;
}

.hidden {
  display: none !important;
}

.message {
  min-height: 28px;
  text-align: center;
  margin-top: 18px;
  font-size: 16px;
  line-height: 1.45;
}

.success {
  color: #188038;
}

.error {
  color: #d93025;
}

.info {
  color: #5f6368;
}

.note {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-top: 20px;
  line-height: 1.5;
}

@media (max-width: 520px) {

  .card {
    padding: 34px 24px;
    border-radius: 24px;
  }

  h1 {
    font-size: 34px;
  }

  .subtitle {
    font-size: 18px;
  }

  .logo {
    font-size: 58px;
  }
}
</style>

</head>

<body>

<main class="card">

  <div class="logo">🛠️</div>

  <h1>Fix My Work</h1>

  <div class="subtitle">
    Local Service Marketplace
  </div>


  <!-- PHONE LOGIN -->

  <section id="phoneSection">

    <label for="phone">
      Mobile Number
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      autocomplete="tel"
      maxlength="10"
      placeholder="10-digit mobile number"
    >

    <button id="sendOtpBtn" type="button">
      Send OTP
    </button>

  </section>


  <!-- OTP -->

  <section id="otpSection" class="hidden">

    <label for="otp">
      Enter OTP
    </label>

    <input
      id="otp"
      type="tel"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="Enter 6-digit OTP"
    >

    <button id="verifyOtpBtn" type="button">
      Verify OTP
    </button>

    <button
      id="changeNumberBtn"
      class="secondary"
      type="button"
    >
      Change Number
    </button>

  </section>


  <div id="message" class="message"></div>

  <div class="note">
    By continuing, you agree to receive an SMS verification code.
  </div>

</main>


<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.2.2/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.2.2/firebase-auth.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCP8DGLQMXPUsv_p2zQ-NLkziwPQe1XkgU",

  authDomain:
  "fixmywork-d83ba.firebaseapp.com",

  projectId:
  "fixmywork-d83ba",

  storageBucket:
  "fixmywork-d83ba.firebasestorage.app",

  messagingSenderId:
  "207313302232",

  appId:
  "1:207313302232:web:73055348982ad84abeddad",

  measurementId:
  "G-11FQMLCBQY"
};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

auth.languageCode = "en";


/* =========================================================
   ELEMENTS
========================================================= */

const phoneSection =
document.getElementById("phoneSection");

const otpSection =
document.getElementById("otpSection");

const phoneInput =
document.getElementById("phone");

const otpInput =
document.getElementById("otp");

const sendOtpBtn =
document.getElementById("sendOtpBtn");

const verifyOtpBtn =
document.getElementById("verifyOtpBtn");

const changeNumberBtn =
document.getElementById("changeNumberBtn");

const message =
document.getElementById("message");


/* =========================================================
   VARIABLES
========================================================= */

let recaptchaVerifier = null;

let confirmationResult = null;


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = "info") {

  message.textContent = text;

  message.className =
  "message " + type;
}


/* =========================================================
   CREATE INVISIBLE RECAPTCHA
========================================================= */

function createRecaptcha() {

  if (recaptchaVerifier) {

    try {

      recaptchaVerifier.clear();

    } catch (error) {

      console.log(
        "reCAPTCHA cleanup:",
        error
      );
    }

    recaptchaVerifier = null;
  }


  recaptchaVerifier =
  new RecaptchaVerifier(

    auth,

    "sendOtpBtn",

    {

      size: "invisible",

      "expired-callback": () => {

        showMessage(
          "Verification expired. Please tap Send OTP again.",
          "error"
        );

      }

    }

  );
}


/* =========================================================
   START RECAPTCHA
========================================================= */

try {

  createRecaptcha();

} catch (error) {

  console.error(
    "reCAPTCHA error:",
    error
  );

  showMessage(
    "Security verification could not start. Please refresh the page.",
    "error"
  );
}


/* =========================================================
   SEND OTP
========================================================= */

sendOtpBtn.addEventListener(
  "click",
  async () => {

    const rawPhone =
    phoneInput.value.trim();


    const phoneDigits =
    rawPhone.replace(/\D/g, "");


    if (phoneDigits.length !== 10) {

      showMessage(
        "Please enter a valid 10-digit mobile number.",
        "error"
      );

      phoneInput.focus();

      return;
    }


    const phoneNumber =
    "+91" + phoneDigits;


    sendOtpBtn.disabled = true;

    sendOtpBtn.textContent =
    "Sending OTP...";


    showMessage(
      "Starting secure verification...",
      "info"
    );


    try {

      if (!recaptchaVerifier) {

        createRecaptcha();

      }


      confirmationResult =
      await signInWithPhoneNumber(

        auth,

        phoneNumber,

        recaptchaVerifier

      );


      window.confirmationResult =
      confirmationResult;


      phoneSection.classList.add(
        "hidden"
      );


      otpSection.classList.remove(
        "hidden"
      );


      otpInput.value = "";

      otpInput.focus();


      showMessage(
        "OTP sent successfully. Please check your SMS.",
        "success"
      );


    } catch (error) {

      console.error(
        "SEND OTP ERROR:",
        error
      );


      let errorText =
      "Unable to send OTP.";


      switch (error.code) {


        case "auth/invalid-phone-number":

          errorText =
          "Invalid mobile number.";

          break;


        case "auth/too-many-requests":

          errorText =
          "Too many attempts. Please wait and try again later.";

          break;


        case "auth/quota-exceeded":

          errorText =
          "SMS quota exceeded. Please try again later.";

          break;


        case "auth/captcha-check-failed":

          errorText =
          "Security verification failed. Please refresh the page and try again.";

          break;


        case "auth/operation-not-allowed":

          errorText =
          "Phone Authentication is not enabled in Firebase.";

          break;


        case "auth/unauthorized-domain":

          errorText =
          "This website domain is not authorized in Firebase.";

          break;


        default:

          errorText =
          error.message ||
          "Unable to send OTP.";
      }


      showMessage(
        errorText,
        "error"
      );


      try {

        createRecaptcha();

      } catch (e) {

        console.error(e);

      }

    }


    finally {

      sendOtpBtn.disabled =
      false;

      sendOtpBtn.textContent =
      "Send OTP";

    }

  }
);


/* =========================================================
   VERIFY OTP
========================================================= */

verifyOtpBtn.addEventListener(
  "click",
  async () => {

    const otp =
    otpInput.value.trim();


    if (!/^\d{6}$/.test(otp)) {

      showMessage(
        "Please enter the 6-digit OTP.",
        "error"
      );

      otpInput.focus();

      return;
    }


    if (!confirmationResult) {

      showMessage(
        "Please request a new OTP first.",
        "error"
      );

      return;
    }


    verifyOtpBtn.disabled = true;

    verifyOtpBtn.textContent =
    "Verifying...";


    showMessage(
      "Verifying OTP...",
      "info"
    );


    try {

      const result =
      await confirmationResult.confirm(
        otp
      );


      const user =
      result.user;


      console.log(
        "LOGIN SUCCESS:",
        user
      );


      otpSection.classList.add(
        "hidden"
      );


      showMessage(
        "Login successful! Welcome to Fix My Work.",
        "success"
      );


    } catch (error) {

      console.error(
        "VERIFY OTP ERROR:",
        error
      );


      let errorText =
      "OTP verification failed.";


      switch (error.code) {


        case "auth/invalid-verification-code":

          errorText =
          "Incorrect OTP. Please check the code.";

          break;


        case "auth/code-expired":

          errorText =
          "OTP expired. Please request a new OTP.";

          break;


        case "auth/session-expired":

          errorText =
          "Verification session expired. Please request a new OTP.";

          break;


        default:

          errorText =
          error.message ||
          "OTP verification failed.";

      }


      showMessage(
        errorText,
        "error"
      );

    }


    finally {

      verifyOtpBtn.disabled =
      false;

      verifyOtpBtn.textContent =
      "Verify OTP";

    }

  }
);


/* =========================================================
   CHANGE NUMBER
========================================================= */

changeNumberBtn.addEventListener(
  "click",
  () => {

    confirmationResult = null;

    window.confirmationResult =
    null;

    otpInput.value = "";


    otpSection.classList.add(
      "hidden"
    );


    phoneSection.classList.remove(
      "hidden"
    );


    showMessage(
      "",
      "info"
    );


    try {

      createRecaptcha();

    } catch (error) {

      console.error(error);

    }


    phoneInput.focus();

  }
);


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  (user) => {

    if (user) {

      console.log(
        "Firebase user:",
        user.uid,
        user.phoneNumber
      );

    } else {

      console.log(
        "No authenticated user."
      );

    }

  }
);

</script>

</body>
</html>
