    body {

    .container {

    .logo {

      margin-bottom: 8px;
      color: #333;
    }

    input {

      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 17px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #4285f4;
    }

    button {

      border: none;

      background: #4285f4;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:disabled {

    }

    #otpSection {
      display: none;
      margin-top: 20px;
    }

    #recaptcha-container {
      margin: 15px 0;
      display: flex;
      justify-content: center;
      min-height: 78px;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .info {
      color: #555;
    }
  </style>
</head>
