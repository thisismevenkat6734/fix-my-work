<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fix My Work</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #4285f4;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #4285f4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #3367d6;
    }

    #otpSection {
      display: none;
      margin-top: 20px;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    #recaptcha-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }

    .success {
      color: green !important;
    }

    .error {
      color: red !important;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🛠️</div>

    <h1>Fix My Work</h1>

    <p class="subtitle">
      Local Service Marketplace
    </p>

    <!-- Phone Login -->
    <div id="loginSection">

      <label for="phone">
        Mobile Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="+91XXXXXXXXXX"
      >

      <div id="recaptcha-container"></div>

      <button id="sendOtpBtn">
        Send OTP
      </button>

    </div>


    <!-- OTP -->
    <div id="otpSection">

      <label for="otp">
        Enter OTP
      </label>

      <input
        type="text"
        id="otp"
        placeholder="Enter 6 digit OTP"
        maxlength="6"
      >

      <button id="verifyOtpBtn">
        Verify OTP
      </button>

    </div>

    <p id="message"></p>

  </div>


  <!-- Firebase Authentication -->

    } from "https
