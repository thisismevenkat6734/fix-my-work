<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4285f4">

<title>Fix My Work</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5fb;
  color:#202124;
}

button,
input,
textarea,
select{
  font:inherit;
}

.page{
  min-height:100vh;
  padding:20px 12px;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:680px;
  background:white;
  border-radius:28px;
  padding:28px 20px;
  margin:auto 0;
  box-shadow:0 15px 45px rgba(0,0,0,.08);
}

.brand{
  text-align:center;
}

.logo{
  font-size:68px;
  line-height:1;
  margin:5px 0 8px;
}

h1{
  font-size:40px;
  margin:0;
  font-weight:800;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  font-size:20px;
  margin:10px 0 28px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.welcome{
  text-align:center;
  margin-bottom:24px;
}

.welcome h2{
  font-size:30px;
  line-height:1.15;
  margin:8px 0 10px;
}

.user-email{
  color:#6b7280;
  font-size:17px;
  word-break:break-word;
}

label{
  display:block;
  font-size:18px;
  font-weight:700;
  margin:16px 0 8px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d5d9df;
  border-radius:16px;
  padding:16px;
  background:white;
  outline:none;
  color:#202124;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#4285f4;
  box-shadow:0 0 0 3px rgba(66,133,244,.12);
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.primary{
  width:100%;
  border:0;
  border-radius:17px;
  padding:18px;
  margin-top:18px;
  background:#4285f4;
  color:white;
  font-size:19px;
  font-weight:700;
}

.secondary{
  width:100%;
  border:0;
  border-radius:17px;
  padding:18px;
  margin-top:12px;
  background:#edf3ff;
  color:#24589a;
  font-size:18px;
  font-weight:700;
}

.danger{
  width:100%;
  border:0;
  border-radius:18px;
  padding:20px;
  margin-top:24px;
  background:#fde8e8;
  color:#c62828;
  font-size:19px;
  font-weight:700;
}

.services{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.service{
  border:1px solid #dce1e8;
  background:#fbfcfe;
  border-radius:21px;
  padding:22px 10px;
  min-height:105px;
  font-size:19px;
  font-weight:700;
  color:#202124;
  box-shadow:0 2px 5px rgba(0,0,0,.02);
}

.service:active{
  transform:scale(.98);
  background:#f2f7ff;
}

.service .icon{
  display:block;
  font-size:28px;
  margin-bottom:7px;
}

.message{
  text-align:center;
  min-height:22px;
  margin-top:16px;
  font-weight:600;
  line-height:1.45;
}

.success{
  color:#188038;
}

.error{
  color:#c5221f;
}

.info{
  color:#5f6368;
}

.request-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#edf2f7;
  font-size:25px;
  flex:none;
}

.request-title{
  font-size:27px;
  font-weight:800;
}

.selected{
  background:#f1f6ff;
  border:1px solid #dbe8ff;
  border-radius:16px;
  padding:15px;
  margin-bottom:18px;
  color:#24589a;
  font-weight:700;
}

.request-id{
  display:none;
  background:#e8f5e9;
  border:1px solid #b7dfba;
  color:#137333;
  border-radius:16px;
  padding:17px;
  margin-top:18px;
  text-align:center;
  line-height:1.6;
  word-break:break-word;
}

.loading{
  opacity:.65;
  pointer-events:none;
}

@media(max-width:520px){

  .container{
    border-radius:24px;
    padding:25px 17px;
  }

  h1{
    font-size:36px;
  }

  .logo{
    font-size:60px;
  }

  .service{
    font-size:17px;
    min-height:100px;
  }

}

@media(max-width:390px){

  .services{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>

<div class="page">

<main class="container">


<!-- ========================= -->
<!-- BRAND -->
<!-- ========================= -->

<div class="brand">

  <div class="logo">
    🛠️
  </div>

  <h1>
    Fix My Work
  </h1>

  <div class="subtitle">
    Local Service Marketplace
  </div>

</div>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<section id="loginScreen" class="screen">

  <label for="loginEmail">
    Email Address
  </label>

  <input
    id="loginEmail"
    type="email"
    autocomplete="email"
    placeholder="Enter your email"
  >


  <label for="loginPassword">
    Password
  </label>

  <input
    id="loginPassword"
    type="password"
    autocomplete="current-password"
    placeholder="Enter your password"
  >


  <button
    id="loginBtn"
    class="primary"
    type="button"
  >
    Login
  </button>


  <button
    id="showSignupBtn"
    class="secondary"
    type="button"
  >
    Create New Account
  </button>


  <div
    id="loginMessage"
    class="message"
  ></div>

</section>



<!-- ========================= -->
<!-- SIGNUP -->
<!-- ========================= -->

<section id="signupScreen" class="screen">

  <label for="signupName">
    Full Name
  </label>

  <input
    id="signupName"
    type="text"
    autocomplete="name"
    placeholder="Enter your full name"
  >


  <label for="signupEmail">
    Email Address
  </label>

  <input
    id="signupEmail"
    type="email"
    autocomplete="email"
    placeholder="Enter your email"
  >


  <label for="signupPassword">
    Password
  </label>

  <input
    id="signupPassword"
    type="password"
    autocomplete="new-password"
    placeholder="Minimum 6 characters"
  >


  <label for="signupConfirm">
    Confirm Password
  </label>

  <input
    id="signupConfirm"
    type="password"
    autocomplete="new-password"
    placeholder="Confirm password"
  >


  <button
    id="signupBtn"
    class="primary"
    type="button"
  >
    Create Account
  </button>


  <button
    id="backLoginBtn"
    class="secondary"
    type="button"
  >
    Back to Login
  </button>


  <div
    id="signupMessage"
    class="message"
  ></div>

</section>



<!-- ========================= -->
<!-- DASHBOARD -->
<!-- ========================= -->

<section
  id="dashboardScreen"
  class="screen"
>


  <div class="welcome">

    <h2>
      Welcome to Fix My Work
    </h2>

    <div
      id="userEmail"
      class="user-email"
    ></div>

  </div>


  <div class="services">


    <button
      class="service"
      type="button"
      data-service="Electrician"
    >

      <span class="icon">
        ⚡
      </span>

      Electrician

    </button>



    <button
      class="service"
      type="button"
      data-service="Plumber"
    >

      <span class="icon">
        🔧
      </span>

      Plumber

    </button>



    <button
      class="service"
      type="button"
      data-service="AC Repair"
    >

      <span class="icon">
        ❄️
      </span>

      AC Repair

    </button>



    <button
      class="service"
      type="button"
      data-service="RO Repair"
    >

      <span class="icon">
        💧
      </span>

      RO Repair

    </button>



    <button
      class="service"
      type="button"
      data-service="Appliance Repair"
    >

      <span class="icon">
        🔌
      </span>

      Appliance Repair

    </button>



    <button
      class="service"
      type="button"
      data-service="Home Services"
    >

      <span class="icon">
        🏠
      </span>

      Home Services

    </button>


  </div>


  <button
    id="logoutBtn"
    class="danger"
    type="button"
  >
    Logout
  </button>


  <div
    id="dashboardMessage"
    class="message"
  ></div>

</section>



<!-- ========================= -->
<!-- SERVICE REQUEST -->
<!-- ========================= -->

<section
  id="requestScreen"
  class="screen"
>


  <div class="request-head">

    <button
      id="backDashboardBtn"
      class="back"
      type="button"
    >
      ←
    </button>

    <div class="request-title">
      Service Request
    </div>

  </div>


  <div
    id="selectedService"
    class="selected"
  >
    Service
  </div>


  <label for="customerName">
    Your Name
  </label>

  <input
    id="customerName"
    type="text"
    autocomplete="name"
    placeholder="Enter your name"
  >


  <label for="customerPhone">
    Mobile Number
  </label>

  <input
    id="customerPhone"
    type="tel"
    inputmode="numeric"
    maxlength="10"
    placeholder="10 digit mobile number"
  >


  <label for="customerLocation">
    Location
  </label>

  <input
    id="customerLocation"
    type="text"
    placeholder="Area / City / Address"
  >


  <label for="problem">
    What do you need?
  </label>

  <textarea
    id="problem"
    placeholder="Describe your problem"
  ></textarea>


  <label for="preferredTime">
    Preferred Time
  </label>

  <select id="preferredTime">

    <option value="">
      Select preferred time
    </option>

    <option value="Morning">
      Morning (8 AM - 12 PM)
    </option>

    <option value="Afternoon">
      Afternoon (12 PM - 4 PM)
    </option>

    <option value="Evening">
      Evening (4 PM - 8 PM)
    </option>

    <option value="Anytime">
      Anytime
    </option>

  </select>


  <button
    id="submitRequestBtn"
    class="primary"
    type="button"
  >
    Submit Service Request
  </button>


  <button
    id="cancelRequestBtn"
    class="secondary"
    type="button"
  >
    Cancel
  </button>


  <div
    id="requestMessage"
    class="message"
  ></div>


  <div
    id="requestId"
    class="request-id"
  ></div>

</section>


</main>

</div>



<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script type="module">


/*
====================================================
FIX MY WORK
FIREBASE CONNECTION
====================================================

Your existing file is:

js/firebase.js

It already exports:
auth
db

We are using that file here.
*/


import {
  auth
} from "./js/firebase.js";


import {
  db
} from "./js/firebase.js";


import {
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =========================
SCREENS
========================= */

const loginScreen =
  document.getElementById("loginScreen");

const signupScreen =
  document.getElementById("signupScreen");

const dashboardScreen =
  document.getElementById("dashboardScreen");

const requestScreen =
  document.getElementById("requestScreen");



/* =========================
MESSAGES
========================= */

const loginMessage =
  document.getElementById("loginMessage");

const signupMessage =
  document.getElementById("signupMessage");

const requestMessage =
  document.getElementById("requestMessage");



/* =========================
USER
========================= */

let currentUser = null;

let currentService = "";



/* =========================
SHOW SCREEN
========================= */

function showScreen(screen){

  loginScreen.classList.remove("active");

  signupScreen.classList.remove("active");

  dashboardScreen.classList.remove("active");

  requestScreen.classList.remove("active");


  screen.classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* =========================
MESSAGE
========================= */

function showMessage(
  element,
  text,
  type=""
){

  element.textContent = text;

  element.className =
    "message " + type;

}



/* =========================
FIREBASE ERROR
========================= */

function firebaseError(error){

  if(!error){

    return "Something went wrong.";

  }


  switch(error.code){

    case "auth/invalid-credential":

      return "Incorrect email or password.";


    case "auth/invalid-login-credentials":

      return "Incorrect email or password.";


    case "auth/invalid-email":

      return "Please enter a valid email address.";


    case "auth/email-already-in-use":

      return "This email is already registered.";


    case "auth/weak-password":

      return "Password must contain at least 6 characters.";


    case "auth/user-not-found":

      return "Account not found.";


    case "auth/wrong-password":

      return "Incorrect password.";


    case "auth/too-many-requests":

      return "Too many attempts. Please try again later.";


    case "auth/network-request-failed":

      return "Internet connection problem.";


    case "permission-denied":

      return "Firebase permission denied. Check Firestore Rules.";


    default:

      return error.message ||
        "Something went wrong.";

  }

}



/* =========================
LOGIN
========================= */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    async function(){

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      if(!email || !password){

        showMessage(
          loginMessage,
          "Please enter email and password.",
          "error"
        );

        return;

      }


      const button =
        document.getElementById("loginBtn");


      try{

        button.classList.add("loading");

        button.textContent =
          "Logging in...";


        showMessage(
          loginMessage,
          "Please wait...",
          "info"
        );


        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      }

      catch(error){

        console.error(error);


        showMessage(
          loginMessage,
          firebaseError(error),
          "error"
        );

      }

      finally{

        button.classList.remove(
          "loading"
        );

        button.textContent =
          "Login";

      }

    }
  );



/* =========================
SHOW SIGNUP
========================= */

document
  .getElementById("showSignupBtn")
  .addEventListener(
    "click",
    function(){

      showMessage(
        loginMessage,
        ""
      );

      showScreen(
        signupScreen
      );

    }
  );



/* =========================
BACK LOGIN
========================= */

document
  .getElementById("backLoginBtn")
  .addEventListener(
    "click",
    function(){

      showMessage(
        signupMessage,
        ""
      );

      showScreen(
        loginScreen
      );

    }
  );



/* =========================
CREATE ACCOUNT
========================= */

document
  .getElementById("signupBtn")
  .addEventListener(
    "click",
    async function(){

      const name =
        document
          .getElementById("signupName")
          .value
          .trim();


      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      const confirm =
        document
          .getElementById("signupConfirm")
          .value;


      if(
        !name ||
        !email ||
        !password ||
        !confirm
      ){

        showMessage(
          signupMessage,
          "Please fill all fields.",
          "error"
        );

        return;

      }


      if(password.length < 6){

        showMessage(
          signupMessage,
          "Password must contain at least 6 characters.",
          "error"
        );

        return;

      }


      if(password !== confirm){

        showMessage(
          signupMessage,
          "Passwords do not match.",
          "error"
        );

        return;

      }


      const button =
        document.getElementById(
          "signupBtn"
        );


      try{

        button.classList.add(
          "loading"
        );

        button.textContent =
          "Creating...";


        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          result.user,
          {
            displayName:name
          }
        );


        showMessage(
          signupMessage,
          "Account created successfully.",
          "success"
        );


      }

      catch(error){

        console.error(error);


        showMessage(
          signupMessage,
          firebaseError(error),
          "error"
        );

      }

      finally{

        button.classList.remove(
          "loading"
        );

        button.textContent =
          "Create Account";

      }

    }
  );



/* =========================
AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  function(user){

    if(user){

      currentUser =
        user;


      document
        .getElementById("userEmail")
        .textContent =
          user.email || "";


      showScreen(
        dashboardScreen
      );

    }

    else{

      currentUser =
        null;


      showScreen(
        loginScreen
      );

    }

  }
);



/* =========================
SERVICE BUTTONS
========================= */

document
  .querySelectorAll(".service")
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          if(!currentUser){

            showScreen(
              loginScreen
            );

            return;

          }


          currentService =
            button.dataset.service;


          document
            .getElementById(
              "selectedService"
            )
            .textContent =
              "🛠️ " +
              currentService;


          const nameInput =
            document.getElementById(
              "customerName"
            );


          if(
            currentUser.displayName &&
            !nameInput.value
          ){

            nameInput.value =
              currentUser.displayName;

          }


          showMessage(
            requestMessage,
            ""
          );


          document
            .getElementById(
              "requestId"
            )
            .style.display =
              "none";


          showScreen(
            requestScreen
          );

        }
      );

    }
  );



/* =========================
BACK TO DASHBOARD
========================= */

document
  .getElementById(
    "backDashboardBtn"
  )
  .addEventListener(
    "click",
    function(){

      showScreen(
        dashboardScreen
      );

    }
  );



/* =========================
CANCEL REQUEST
========================= */

document
  .getElementById(
    "cancelRequestBtn"
  )
  .addEventListener(
    "click",
    function(){

      showScreen(
        dashboardScreen
      );

    }
  );



/* =========================
SUBMIT REQUEST
========================= */

document
  .getElementById(
    "submitRequestBtn"
  )
  .addEventListener(
    "click",
    async function(){

      if(!currentUser){

        showMessage(
          requestMessage,
          "Please login first.",
          "error"
        );

        return;

      }


      const name =
        document
          .getElementById(
            "customerName"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "customerPhone"
          )
          .value
          .trim();


      const location =
        document
          .getElementById(
            "customerLocation"
          )
          .value
          .trim();


      const problem =
        document
          .getElementById(
            "problem"
          )
          .value
          .trim();


      const preferredTime =
        document
          .getElementById(
            "preferredTime"
          )
          .value;


      if(
        !name ||
        !phone ||
        !location ||
        !problem ||
        !preferredTime
      ){

        showMessage(
          requestMessage,
          "Please fill all fields.",
          "error"
        );

        return;

      }


      if(
        !/^[0-9]{10}$/.test(phone)
      ){

        showMessage(
          requestMessage,
          "Please enter a valid 10 digit mobile number.",
          "error"
        );

        return;

      }


      const button =
        document.getElementById(
          "submitRequestBtn"
        );


      try{

        button.classList.add(
          "loading"
        );

        button.textContent =
          "Submitting...";


        showMessage(
          requestMessage,
          "Sending your request...",
          "info"
        );


        const docRef =
          await addDoc(
            collection(
              db,
              "serviceRequests"
            ),
            {

              service:
                currentService,

              customerName:
                name,

              customerPhone:
                phone,

              customerLocation:
                location,

              problem:
                problem,

              preferredTime:
                preferredTime,

              userId:
                currentUser.uid,

              userEmail:
                currentUser.email || "",

              status:
                "pending",

              createdAt:
                serverTimestamp()

            }
          );


        showMessage(
          requestMessage,
          "Request submitted successfully.",
          "success"
        );


        const requestId =
          document.getElementById(
            "requestId"
          );


        requestId.style.display =
          "block";


        requestId.innerHTML =
          "<strong>Request ID</strong><br>" +
          docRef.id +
          "<br><br>" +
          "Your service request has been received.";


        document
          .getElementById(
            "customerPhone"
          )
          .value = "";


        document
          .getElementById(
            "customerLocation"
          )
          .value = "";


        document
          .getElementById(
            "problem"
          )
          .value = "";


        document
          .getElementById(
            "preferredTime"
          )
          .value = "";

      }

      catch(error){

        console.error(error);


        showMessage(
          requestMessage,
          firebaseError(error),
          "error"
        );

      }

      finally{

        button.classList.remove(
          "loading"
        );

        button.textContent =
          "Submit Service Request";

      }

    }
  );



/* =========================
LOGOUT
========================= */

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async function(){

      try{

        await signOut(
          auth
        );

      }

      catch(error){

        console.error(error);

        showMessage(
          document.getElementById(
            "dashboardMessage"
          ),
          firebaseError(error),
          "error"
        );

      }

    }
  );


/* =========================
START
========================= */

showScreen(
  loginScreen
);

</script>

</body>
    </html>
