<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#4285F4"
>

<title>Fix My Work</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef4ff,
            #f7f9fc
        );

    color: #202124;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* =========================
   CARD
========================= */

.card {
    width: 100%;
    max-width: 620px;

    background: white;

    border-radius: 30px;

    padding: 40px 36px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.10);
}


/* =========================
   LOGO
========================= */

.logo {
    text-align: center;

    font-size: 64px;

    margin-bottom: 12px;
}


/* =========================
   HEADINGS
========================= */

h1 {
    margin: 0;

    text-align: center;

    font-size: 40px;

    font-weight: 800;
}

.subtitle {
    text-align: center;

    color: #6b7280;

    font-size: 19px;

    margin-top: 10px;

    margin-bottom: 35px;
}


/* =========================
   FORM
========================= */

label {
    display: block;

    font-size: 17px;

    font-weight: 700;

    margin-bottom: 9px;
}

input {
    width: 100%;

    height: 60px;

    border: 1px solid #d8dde6;

    border-radius: 14px;

    outline: none;

    padding:
        0 16px;

    font-size: 17px;

    margin-bottom: 16px;

    background: white;
}

input:focus {
    border-color: #4285f4;

    box-shadow:
        0 0 0 3px
        rgba(66, 133, 244, 0.12);
}


/* =========================
   BUTTONS
========================= */

button {
    width: 100%;

    height: 60px;

    border: none;

    border-radius: 14px;

    background: #4285f4;

    color: white;

    font-size: 18px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.1s,
        opacity 0.2s;
}

button:active {
    transform: scale(0.99);
}

button:disabled {
    opacity: 0.65;

    cursor: not-allowed;
}

.secondary-button {
    background: #edf3ff;

    color: #2459a6;

    margin-top: 12px;
}

.danger-button {
    background: #fce8e6;

    color: #c5221f;

    margin-top: 20px;
}


/* =========================
   LINKS
========================= */

.link-row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 15px;

    margin-bottom: 10px;
}

.link-button {
    width: auto;

    height: auto;

    padding: 0;

    background: none;

    color: #4285f4;

    font-size: 14px;

    font-weight: 600;
}


/* =========================
   MESSAGE
========================= */

.message {
    min-height: 25px;

    text-align: center;

    margin-top: 17px;

    font-size: 15px;

    line-height: 1.45;
}

.success {
    color: #188038;
}

.error {
    color: #d93025;
}

.info {
    color: #5f6368;
}


/* =========================
   HIDDEN
========================= */

.hidden {
    display: none !important;
}


/* =========================
   HOME
========================= */

.home {
    text-align: center;
}

.home h2 {
    margin: 0;

    font-size: 30px;
}

.user-email {
    color: #5f6368;

    margin-top: 10px;

    word-break: break-word;
}

.service-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-top: 28px;
}

.service {
    padding: 20px 10px;

    border:
        1px solid #e1e5eb;

    border-radius: 16px;

    background: #fafbfc;

    font-weight: 700;

    font-size: 15px;
}


/* =========================
   MODAL
========================= */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.45);

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    z-index: 100;
}

.modal-box {
    width: 100%;

    max-width: 480px;

    background: white;

    border-radius: 22px;

    padding: 28px;
}

.modal-box h2 {
    margin-top: 0;

    margin-bottom: 10px;
}

.close-button {
    background: #f1f3f4;

    color: #333;

    margin-top: 10px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    body {
        padding: 12px;
    }

    .card {
        padding:
            30px 20px;

        border-radius: 24px;
    }

    .logo {
        font-size: 56px;
    }

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 17px;
    }

    .service-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

</style>
</head>


<body>


<div class="card">


<!-- ==================================================
     LOGIN / REGISTER VIEW
================================================== -->

<div id="authView">


    <div class="logo">
        🛠️
    </div>


    <h1>
        Fix My Work
    </h1>


    <div class="subtitle">
        Local Service Marketplace
    </div>


    <!-- =========================
         LOGIN FORM
    ========================== -->

    <div id="loginForm">


        <label for="loginEmail">
            Email Address
        </label>


        <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
        >


        <label for="loginPassword">
            Password
        </label>


        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
        >


        <button
            id="loginBtn"
            type="button"
        >
            Login
        </button>


        <div class="link-row">


            <button
                id="forgotBtn"
                type="button"
                class="link-button"
            >
                Forgot Password?
            </button>


            <button
                id="showRegisterBtn"
                type="button"
                class="link-button"
            >
                Create Account
            </button>


        </div>


    </div>


    <!-- =========================
         REGISTER FORM
    ========================== -->

    <div
        id="registerForm"
        class="hidden"
    >


        <label for="registerName">
            Full Name
        </label>


        <input
            id="registerName"
            type="text"
            autocomplete="name"
            placeholder="Enter your name"
        >


        <label for="registerEmail">
            Email Address
        </label>


        <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
        >


        <label for="registerPassword">
            Password
        </label>


        <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Minimum 6 characters"
        >


        <label for="confirmPassword">
            Confirm Password
        </label>


        <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Re-enter password"
        >


        <button
            id="registerBtn"
            type="button"
        >
            Create Account
        </button>


        <button
            id="showLoginBtn"
            type="button"
            class="secondary-button"
        >
            Back to Login
        </button>


    </div>


    <!-- =========================
         MESSAGE
    ========================== -->

    <div
        id="message"
        class="message"
    ></div>


    <div class="small">
        Secure authentication powered by Firebase
    </div>


</div>



<!-- ==================================================
     HOME VIEW
================================================== -->

<div
    id="homeView"
    class="home hidden"
>


    <div class="logo">
        🛠️
    </div>


    <h2>
        Welcome to Fix My Work
    </h2>


    <p
        id="userEmail"
        class="user-email"
    ></p>


    <div class="service-grid">


        <div class="service">
            ⚡ Electrician
        </div>


        <div class="service">
            🔧 Plumber
        </div>


        <div class="service">
            ❄️ AC Repair
        </div>


        <div class="service">
            💧 RO Repair
        </div>


        <div class="service">
            🔌 Appliance Repair
        </div>


        <div class="service">
            🏠 Home Services
        </div>


    </div>


    <button
        id="logoutBtn"
        type="button"
        class="danger-button"
    >
        Logout
    </button>


</div>


</div>



<!-- ==================================================
     FORGOT PASSWORD MODAL
================================================== -->

<div
    id="resetModal"
    class="modal hidden"
>


    <div class="modal-box">


        <h2>
            Reset Password
        </h2>


        <p>
            Enter your email address. Firebase will
            send a password reset link.
        </p>


        <label for="resetEmail">
            Email Address
        </label>


        <input
            id="resetEmail"
            type="email"
            placeholder="Enter your email"
        >


        <button
            id="sendResetBtn"
            type="button"
        >
            Send Reset Email
        </button>


        <button
            id="closeResetBtn"
            type="button"
            class="close-button"
        >
            Close
        </button>


        <div
            id="resetMessage"
            class="message"
        ></div>


    </div>


</div>



<!-- ==================================================
     FIREBASE
================================================== -->

<script type="module">


/* ==================================================
   FIREBASE APP
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


/* ==================================================
   FIREBASE AUTH
================================================== */

import {
    getAuth,

    createUserWithEmailAndPassword,

    signInWithEmailAndPassword,

    sendPasswordResetEmail,

    signOut,

    onAuthStateChanged,

    updateProfile
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyCP8DGLQMXPUsv_p2zQ-NLkziwPQe1XkgU",

    authDomain:
    "fixmywork-d83ba.firebaseapp.com",

    projectId:
    "fixmywork-d83ba",

    storageBucket:
    "fixmywork-d83ba.firebasestorage.app",

    messagingSenderId:
    "207313302232",

    appId:
    "1:207313302232:web:73055348982ad84abeddad",

    measurementId:
    "G-11FQMLCBQY"

};



/* ==================================================
   INITIALIZE
================================================== */

const app =
initializeApp(
    firebaseConfig
);


const auth =
getAuth(
    app
);



/* ==================================================
   ELEMENTS
================================================== */

const authView =
document.getElementById(
    "authView"
);


const homeView =
document.getElementById(
    "homeView"
);


const loginForm =
document.getElementById(
    "loginForm"
);


const registerForm =
document.getElementById(
    "registerForm"
);


const loginEmail =
document.getElementById(
    "loginEmail"
);


const loginPassword =
document.getElementById(
    "loginPassword"
);


const registerName =
document.getElementById(
    "registerName"
);


const registerEmail =
document.getElementById(
    "registerEmail"
);


const registerPassword =
document.getElementById(
    "registerPassword"
);


const confirmPassword =
document.getElementById(
    "confirmPassword"
);


const loginBtn =
document.getElementById(
    "loginBtn"
);


const registerBtn =
document.getElementById(
    "registerBtn"
);


const logoutBtn =
document.getElementById(
    "logoutBtn"
);


const showRegisterBtn =
document.getElementById(
    "showRegisterBtn"
);


const showLoginBtn =
document.getElementById(
    "showLoginBtn"
);


const forgotBtn =
document.getElementById(
    "forgotBtn"
);


const message =
document.getElementById(
    "message"
);


const userEmail =
document.getElementById(
    "userEmail"
);


const resetModal =
document.getElementById(
    "resetModal"
);


const resetEmail =
document.getElementById(
    "resetEmail"
);


const sendResetBtn =
document.getElementById(
    "sendResetBtn"
);


const closeResetBtn =
document.getElementById(
    "closeResetBtn"
);


const resetMessage =
document.getElementById(
    "resetMessage"
);



/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text,
    type = "info"
) {

    message.textContent =
    text;

    message.className =
    "message " + type;
}


/* ==================================================
   RESET MESSAGE
================================================== */

function showResetMessage(
    text,
    type = "info"
) {

    resetMessage.textContent =
    text;

    resetMessage.className =
    "message " + type;
}



/* ==================================================
   ERROR HANDLER
================================================== */

function getErrorMessage(
    error
) {

    console.log(
        "Firebase error:",
        error.code,
        error.message
    );


    switch (
        error.code
    ) {


        case
        "auth/invalid-email":

            return "Please enter a valid email address.";


        case
        "auth/missing-password":

            return "Please enter your password.";


        case
        "auth/weak-password":

            return "Password must contain at least 6 characters.";


        case
        "auth/email-already-in-use":

            return "This email is already registered. Please login.";


        case
        "auth/invalid-credential":

            return "Incorrect email or password.";


        case
        "auth/user-not-found":

            return "No account found with this email.";


        case
        "auth/wrong-password":

            return "Incorrect password.";


        case
        "auth/user-disabled":

            return "This account has been disabled.";


        case
        "auth/too-many-requests":

            return "Too many attempts. Please wait and try again later.";


        case
        "auth/network-request-failed":

            return "Network error. Please check your internet connection.";


        case
        "auth/operation-not-allowed":

            return "Email/Password login is not enabled in Firebase.";


        case
        "auth/invalid-api-key":

            return "Firebase configuration error. Please check the Firebase settings.";


        case
        "auth/quota-exceeded":

            return "Firebase quota exceeded. Please try again later.";


        default:

            return (
                error.message ||
                "Something went wrong. Please try again."
            );

    }

}



/* ==================================================
   SHOW LOGIN
================================================== */

showLoginBtn.addEventListener(
    "click",
    function() {

        registerForm.classList.add(
            "hidden"
        );

        loginForm.classList.remove(
            "hidden"
        );

        showMessage(
            "",
            "info"
        );

    }
);



/* ==================================================
   SHOW REGISTER
================================================== */

showRegisterBtn.addEventListener(
    "click",
    function() {

        loginForm.classList.add(
            "hidden"
        );

        registerForm.classList.remove(
            "hidden"
        );

        showMessage(
            "",
            "info"
        );

    }
);



/* ==================================================
   CREATE ACCOUNT
================================================== */

registerBtn.addEventListener(
    "click",
    async function() {


        const name =
        registerName.value.trim();


        const email =
        registerEmail.value.trim();


        const password =
        registerPassword.value;


        const confirm =
        confirmPassword.value;


        /* Name */

        if (
            name.length < 2
        ) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            registerName.focus();

            return;
        }


        /* Email */

        if (
            !email ||
            !email.includes("@")
        ) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

            registerEmail.focus();

            return;
        }


        /* Password */

        if (
            password.length < 6
        ) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            registerPassword.focus();

            return;
        }


        /* Confirm */

        if (
            password !== confirm
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            confirmPassword.focus();

            return;
        }


        registerBtn.disabled =
        true;


        registerBtn.textContent =
        "Creating Account...";


        showMessage(
            "Creating your account...",
            "info"
        );


        try {


            const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


            /* Save display name */

            await updateProfile(
                result.user,
                {
                    displayName:
                    name
                }
            );


            showMessage(
                "Account created successfully!",
                "success"
            );


            /* Auth observer will
               automatically show home */

        }
        catch (error) {


            showMessage(
                getErrorMessage(error),
                "error"
            );

        }
        finally {


            registerBtn.disabled =
            false;


            registerBtn.textContent =
            "Create Account";

        }

    }
);



/* ==================================================
   LOGIN
================================================== */

loginBtn.addEventListener(
    "click",
    async function() {


        const email =
        loginEmail.value.trim();


        const password =
        loginPassword.value;


        if (
            !email
        ) {

            showMessage(
                "Please enter your email address.",
                "error"
            );

            loginEmail.focus();

            return;
        }


        if (
            !password
        ) {

            showMessage(
                "Please enter your password.",
                "error"
            );

            loginPassword.focus();

            return;
        }


        loginBtn.disabled =
        true;


        loginBtn.textContent =
        "Logging in...";


        showMessage(
            "Signing you in...",
            "info"
        );


        try {


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            showMessage(
                "Login successful!",
                "success"
            );


        }
        catch (error) {


            showMessage(
                getErrorMessage(error),
                "error"
            );

        }
        finally {


            loginBtn.disabled =
            false;


            loginBtn.textContent =
            "Login";

        }

    }
);



/* ==================================================
   FORGOT PASSWORD
================================================== */

forgotBtn.addEventListener(
    "click",
    function() {


        resetEmail.value =
        loginEmail.value.trim();


        showResetMessage(
            "",
            "info"
        );


        resetModal.classList.remove(
            "hidden"
        );


        setTimeout(
            function() {

                resetEmail.focus();

            },
            100
        );

    }
);



/* ==================================================
   CLOSE RESET
================================================== */

closeResetBtn.addEventListener(
    "click",
    function() {

        resetModal.classList.add(
            "hidden"
        );

    }
);



/* ==================================================
   RESET PASSWORD EMAIL
================================================== */

sendResetBtn.addEventListener(
    "click",
    async function() {


        const email =
        resetEmail.value.trim();


        if (
            !email ||
            !email.includes("@")
        ) {

            showResetMessage(
                "Please enter a valid email address.",
                "error"
            );

            resetEmail.focus();

            return;
        }


        sendResetBtn.disabled =
        true;


        sendResetBtn.textContent =
        "Sending...";


        showResetMessage(
            "Sending password reset email...",
            "info"
        );


        try {


            await sendPasswordResetEmail(
                auth,
                email
            );


            showResetMessage(
                "Password reset email sent. Check your inbox.",
                "success"
            );


        }
        catch (error) {


            showResetMessage(
                getErrorMessage(error),
                "error"
            );

        }
        finally {


            sendResetBtn.disabled =
            false;


            sendResetBtn.textContent =
            "Send Reset Email";

        }

    }
);



/* ==================================================
   LOGOUT
================================================== */

logoutBtn.addEventListener(
    "click",
    async function() {


        logoutBtn.disabled =
        true;


        logoutBtn.textContent =
        "Logging out...";


        try {


            await signOut(
                auth
            );


        }
        catch (error) {


            console.error(
                "Logout error:",
                error
            );


        }
        finally {


            logoutBtn.disabled =
            false;


            logoutBtn.textContent =
            "Logout";

        }

    }
);



/* ==================================================
   AUTH STATE
================================================== */

onAuthStateChanged(
    auth,
    function(user) {


        if (
            user
        ) {


            /* Hide auth */

            authView.classList.add(
                "hidden"
            );


            /* Show home */

            homeView.classList.remove(
                "hidden"
            );


            /* User email */

            userEmail.textContent =
            user.email ||
            "";


        }
        else {


            /* Show auth */

            authView.classList.remove(
                "hidden"
            );


            /* Hide home */

            homeView.classList.add(
                "hidden"
            );

        }

    }
);



/* ==================================================
   ENTER KEY SUPPORT
================================================== */

loginPassword.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loginBtn.click();

        }

    }
);


confirmPassword.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            registerBtn.click();

        }

    }
);


/* ==================================================
   CLOSE MODAL BY BACKGROUND
================================================== */

resetModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === resetModal
        ) {

            resetModal.classList.add(
                "hidden"
            );

        }

    }
);


</script>

</body>
</html>
